<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Encryption & Decryption</title>

    <!-- fav icon -->
    <link href="./img/devops.png" rel="icon" type="image/png" sizes="32x32" />

    <!-- fontawesome css1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- bootstrap css1 js1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Google Fonts: Inter & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- custom css -->
    <link href="./style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div id="banner"></div>
    <!-- Start Header Section -->
    <header>
        <nav class="navbar navbar-expand-md py-2">
            <div class="container px-3 px-md-0">
                <a href="javascript:void(0);" class="navbar-brand d-flex align-items-center gap-2 m-0">
                    <img src="./img/devops.png" width="50" alt="site-logo" />
                    <span class="fw-bold fs-6 fs-md-5">Caesar Cipher</span>
                </a>

                <div class="mode-toggle-wrapper d-flex align-items-center gap-2 my-2 my-md-0 fw-bold fs-6 fs-md-6">
                    <span id="labelEncrypt" class="mode-label active">Encryption</span>
                    <div class="form-check form-switch m-0 p-0 d-flex align-items-center">
                        <input class="form-check-input ms-0" type="checkbox" role="switch" id="modeToggle">
                    </div>
                    <span id="labelDecrypt" class="mode-label text-muted">Decryption</span>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" id="themeToggleBtn" class="btn btn-outline-secondary d-flex align-items-center justify-content-center" title="Toggle theme">
                        <i id="themeIcon" class="fa-solid fa-moon"></i>
                    </button>
                    <a href="#" class="btn btn-dark">Contact Me</a>
                </div>
            </div>
        </nav>
    </header>
    <!-- End Header Section -->

    <!-- Start Body Section for both Encryption & Decryption -->
    <section class="px-3 px-md-0">
        <div class="container d-flex flex-column p-0 cipher_container">
            <div class="row g-0 w-100 flex-grow-1 flex-column flex-md-row position-relative">
                <!-- Input Column -->
                <div class="col-12 col-md-6 d-flex flex-column p-0 input_container">
                    <h5 id="inputHeading" class="d-flex align-items-center justify-content-center gap-2 m-0 px-3">
                        <span>Plain Text</span>
                        <span id="inputBadge" class="badge badge-sm rounded-pill text-bg-success text-white opacity-75">LIVE INPUT</span>
                    </h5>
                    <div class="textarea-wrapper flex-grow-1 position-relative d-flex flex-column">
                        <textarea id="inputText" class="form-control flex-grow-1 cipher_textarea" placeholder="Type message here..." aria-label="Input Text"></textarea>
                        <!-- Paste and Clear Buttons -->
                        <div class="textarea-actions-group position-absolute top-0 end-0 me-2 mt-2 d-flex align-items-center gap-1">
                            <button type="button" id="pasteBtn" class="textarea-icon-btn" title="Paste text" data-bs-toggle="tooltip" data-bs-trigger="manual" data-bs-title="Pasted!">
                                <i class="fa-regular fa-paste"></i>
                            </button>
                            <button type="button" id="clearBtn" class="textarea-icon-btn" title="Clear text">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center px-2 py-1 border-top text-muted fs-6 opacity-75">
                            <span id="wordCount">0 words</span>
                            <span id="charCount">0 chars</span>
                        </div>
                    </div>
                </div>

                <!-- Center Swap Button Overlay -->
                <button type="button" id="swapBtn" class="center-swap-btn" title="Swap input and output">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </button>

                <!-- Output Column -->
                <div class="col-12 col-md-6 d-flex flex-column p-0 output_container">
                    <h5 id="outputHeading" class="d-flex align-items-center justify-content-center gap-2 m-0 px-3">
                        <span>Encrypted</span>
                        <span id="outputBadge" class="badge badge-sm rounded-pill text-bg-primary text-white opacity-75">LIVE ENCRYPTION</span>
                    </h5>
                    <div class="textarea-wrapper flex-grow-1 position-relative d-flex flex-column">
                        <textarea id="outputText" class="form-control flex-grow-1 cipher_textarea" readonly placeholder="Encrypted result..." aria-label="Output Text"></textarea>
                        <button type="button" id="copyBtn" class="textarea-icon-btn" title="Copy text" data-bs-toggle="tooltip" data-bs-trigger="manual" data-bs-title="Copied!">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-100 p-3 controls_wrapper">
                <div class="row align-items-end g-2">
                    <div class="col-12">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="shiftRange" class="form-label fw-bold m-0" aria-label="Shift Amount">Shift Amount (1-25):</label>
                            <span class="badge text-bg-primary fs-6 font-monospace" id="shiftValueDisplay">3</span>
                        </div>

                        <div class="d-flex align-items-center gap-2 mt-2">
                            <button type="button" id="randomShiftBtn" class="btn btn-sm btn-outline-primary">
                                <i class="fa-solid fa-dice"></i> Random Key
                            </button>
                        </div>

                        <input type="range" id="shiftRange" class="form-range" value="3" min="1" max="25">

                        <div class="mt-2">
                            <span id="shiftPreview" class="badge text-bg-secondary font-monospace px-2 py-1 fs-6 fw-medium border border-secondary-subtle">A -&gt; D | B -&gt; E | C -&gt; F</span>
                        </div>
                    </div>

                    <div id="bruteForceContainer" class="d-none mt-3 pt-2 border-top">
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input" type="checkbox" id="bruteForceToggle" />
                            <label class="form-check-label fw-bold ms-2" for="bruteForceToggle">Try All Shifts (Brute Force)</label>
                        </div>

                        <div id="bruteForceResults" class="d-none mt-3">
                            <h6 class="fw-bold mb-2">All Possible Shift Results:</h6>
                            <div id="bruteForceList" class="list-group list-group-flush border rounded overflow-auto" style="max-height: 250px;">
                                <!-- Inject shift rows from JS here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- End Body Section for both Encryption & Decryption -->

    <footer class="text-center py-3 border-top">
        <div class="container d-flex align-items-center justify-content-center gap-2 text-muted fs-6">
            <span>Created by <strong>Aye Chan @ Aryan</strong></span>
            <span class="d-none d-sm-inline">.</span>
            <span>Released under the <a href="https://opensource.org/licenses/MIT" target="_blank" class="footer-link">MIT License</a></span>
            <span class="d-none d-sm-inline">.</span>
            <div class="d-flex align-items-center gap-2 ms-sm-1">
                <a href="https://github.com/ayechanlabs" target="_blank" class="social-link" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="#" target="_blank" class="social-link" title="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- bootstrap css1 js1 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- particles js1 & custom js for particles -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            particlesJS.load('banner', 'particles.json', function() {
                console.log('particles.js loaded via json config');
            });
        });
    </script>

    <!-- custom js for caesar cipher -->
    <script src="script.js" type="text/javascript"></script>
</body>
</html>
