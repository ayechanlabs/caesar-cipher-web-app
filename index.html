<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Encryption & Decryption</title>

    <!-- fav icon -->
    <link href="./img/devops.png" rel="icon" type="image/png" sizes="32x32" />

    <!-- bootstrap css1 js1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- custom css -->
    <link href="./style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <!-- Start Header Section -->
    <header>
        <nav class="navbar navbar-expand-md">
            <div class="container">
                <a href="javascript:void(0);" class="navbar-brand">
                    <img src="./img/devops.png" width="50" alt="site-logo" />
                    <span>Caesar Cipher</span>
                </a>

                <div>
                    <ul class="navbar-nav gap-5">
                        <li class="nav-item"><a href="#" id="navEncryption" class="nav-link active fw-bold">Encryption</a></li>
                        <li class="nav-item"><a href="#" id="navDecryption" class="nav-link">Decryption</a></li>
                    </ul>
                </div>

                <div>
                    <a href="#" class="btn btn-dark">Contact Me</a>
                </div>
            </div>
        </nav>
    </header>
    <!-- End Header Section -->

    <!-- Start Body Section for both Encryption & Decryption -->
    <section class="px-3 px-md-0">
        <div class="container cipher_container d-flex flex-column p-0">
            <div class="row g-0 w-100 flex-grow-1 flex-column flex-md-row">
                <div class="col-12 col-md-6 d-flex flex-column p-0 input_container">
                    <h5 id="inputHeading" class="text-center m-0">Plain Text</h5>
                    <textarea id="inputText" class="form-control flex-grow-1 cipher_textarea" placeholder="Type message here..."></textarea>
                </div>

                <div class="col-12 col-md-6 d-flex flex-column p-0 output_container">
                    <h5 id="outputHeading" class="text-center m-0">Encrypted Text</h5>
                    <textarea id="outputText" class="form-control flex-grow-1 cipher_textarea" readonly placeholder="Encrypted result..."></textarea>
                </div>
            </div>

            <div class="w-100 p-3 controls_wrapper">
                <div class="row align-items-end g-2">
                    <div class="col-12 col-md-9">
                        <label for="shiftKey" class="form-label fw-bold mb-1">Shift Amount (1-25):</label>
                        <input type="number" id="shiftKey" class="form-control border-black" value="3" min="1" max="25">
                    </div>
                
                    <div class="col-12 col-md-3">
                        <button id="actionBtn" class="btn btn-primary w-100">Encrypt</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- End Body Section for both Encryption & Decryption -->

    <!-- bootstrap css1 js1 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="script.js" type="text/javascript"></script>
</body>
</html>
