<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Encryption & Decryption</title>

    <!-- fav icon -->
    <link href="./img/devops.png" rel="icon" type="image/png" sizes="32x32" />

    <!-- fontawesome css1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- bootstrap css1 js1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- custom css -->
    <link href="./style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div id="banner"></div>
    <!-- Start Header Section -->
    <header>
        <nav class="navbar navbar-expand-md py-2">
            <div class="container px-3 px-md-0">
                <a href="javascript:void(0);" class="navbar-brand d-flex align-items-center gap-2 m-0">
                    <img src="./img/devops.png" width="50" alt="site-logo" />
                    <span class="fw-bold fs-6 fs-md-5">Caesar Cipher</span>
                </a>

                <div class="mode-toggle-wrapper d-flex align-items-center gap-2 my-2 my-md-0 fw-bold fs-7 fs-md-6">
                    <span id="labelEncrypt" class="mode-label active">Encryption</span>
                    <div class="form-check form-switch m-0 p-0 d-flex align-items-center">
                        <input class="form-check-input ms-0" type="checkbox" role="switch" id="modeToggle">
                    </div>
                    <span id="labelDecrypt" class="mode-label text-muted">Decryption</span>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" id="themeToggleBtn" class="btn btn-outline-secondary d-flex align-items-center justify-content-center" title="Toggle theme">
                        <i id="themeIcon" class="fa-solid fa-moon"></i>
                    </button>
                    <a href="#" class="btn btn-dark">Contact Me</a>
                </div>
            </div>
        </nav>
    </header>
    <!-- End Header Section -->

    <!-- Start Body Section for both Encryption & Decryption -->
    <section class="px-3 px-md-0">
        <div class="container d-flex flex-column p-0 cipher_container">
            <div class="row g-0 w-100 flex-grow-1 flex-column flex-md-row">
                <div class="col-12 col-md-6 d-flex flex-column p-0 input_container">
                    <h5 id="inputHeading" class="text-center m-0">Plain Text</h5>
                    <div class="textarea-wrapper flex-grow-1 position-relative d-flex flex-column">
                        <textarea id="inputText" class="form-control flex-grow-1 cipher_textarea" placeholder="Type message here..."></textarea>
                        <div class="position-absolute bottom-0 end-0 p-2 text-muted fs-7 opacity-75" id="charCount">
                            0 chars
                        </div>
                        <button type="button" id="clearBtn" class="textarea-icon-btn" title="Clear text">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>

                <div class="col-12 col-md-6 d-flex flex-column p-0 output_container">
                    <h5 id="outputHeading" class="text-center m-0">Encrypted Text</h5>
                    <div class="textarea-wrapper flex-grow-1 position-relative d-flex flex-column">
                        <textarea id="outputText" class="form-control flex-grow-1 cipher_textarea" readonly placeholder="Encrypted result..."></textarea>
                        <button type="button" id="copyBtn" class="textarea-icon-btn" title="Copy text">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-100 p-3 controls_wrapper">
                <div class="row align-items-end g-2">
                    <div class="col-12 col-md-9">
                        <label for="shiftKey" class="form-label fw-bold mb-1">Shift Amount (1-25):</label>
                        <input type="number" id="shiftKey" class="form-control" value="3" min="1" max="25">
                    </div>
                
                    <div class="col-12 col-md-3">
                        <button id="actionBtn" class="btn btn-primary w-100">Encrypt</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- End Body Section for both Encryption & Decryption -->

    <!-- bootstrap css1 js1 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- particles js1 & custom js for particles -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            particlesJS.load('banner', 'particles.json', function() {
                console.log('particles.js loaded via json config');
            });
        });
    </script>

    <!-- custom js for caesar cipher -->
    <script src="script.js" type="text/javascript"></script>
</body>
</html>
